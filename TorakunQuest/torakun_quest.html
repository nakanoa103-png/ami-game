<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>虎くんクエスト</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-touch-callout:none; }
  html,body { background:#0a0a12; height:100%; overflow:hidden;
    font-family:'DotGothic16','MS Gothic',monospace; color:#fff; }
  #app { max-width:540px; margin:0 auto; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; }
  #screen { position:relative; width:100%; aspect-ratio:3/2; background:#000;
    border:3px solid #333; border-radius:4px; overflow:hidden; }
  #cv { width:100%; height:100%; display:block; image-rendering:pixelated; }

  /* ドラクエ風ウィンドウ（白二重枠） */
  .win { position:absolute; background:rgba(0,0,16,0.92); color:#fff;
    border:2px solid #fff; border-radius:6px; box-shadow:inset 0 0 0 2px #000, inset 0 0 0 3px #fff;
    padding:10px 12px; font-size:14px; line-height:1.7; letter-spacing:1px; }
  #statwin { top:8px; left:8px; font-size:12px; line-height:1.5; display:none; white-space:pre; }
  #msgwin { left:4%; right:4%; bottom:4%; min-height:88px; display:none; }
  #msgcursor { position:absolute; right:14px; bottom:4px; animation:blink 0.7s infinite; display:none; }
  @keyframes blink { 50% { opacity:0; } }
  .menu { font-size:14px; white-space:pre; }
  .menu .item { padding:1px 4px; }
  .menu .item.sel::before { content:"▶"; margin-right:4px; }
  .menu .item:not(.sel)::before { content:"　"; margin-right:4px; }
  .menu .mtitle { text-align:center; border-bottom:1px solid #888; margin-bottom:4px; padding-bottom:2px; font-size:12px; color:#ffd54f; }

  /* バーチャルパッド */
  #pad { width:100%; display:flex; justify-content:space-between; align-items:center;
    user-select:none; touch-action:none; padding:0 4px; }
  #dpad { display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(3,52px); }
  .pbtn { background:#1c1c2e; border:2px solid #444; border-radius:10px; color:#aaa;
    display:flex; align-items:center; justify-content:center; font-size:20px; }
  .pbtn:active, .pbtn.held { background:#3949ab; color:#fff; }
  #ab { display:flex; gap:14px; }
  .abtn { width:62px; height:62px; border-radius:50%; background:#1c1c2e; border:2px solid #444;
    color:#ddd; font-size:18px; display:flex; align-items:center; justify-content:center;
    font-family:inherit; }
  .abtn:active { background:#c62828; color:#fff; }
  #hint { font-size:11px; color:#667; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="cv" width="480" height="320"></canvas>
    <div id="statwin" class="win"></div>
    <div id="menus"></div>
    <div id="msgwin" class="win"><div id="msgtext"></div><div id="msgcursor">▼</div></div>
  </div>
  <div id="pad">
    <div id="dpad">
      <div></div><div class="pbtn" data-dir="up">▲</div><div></div>
      <div class="pbtn" data-dir="left">◀</div><div></div><div class="pbtn" data-dir="right">▶</div>
      <div></div><div class="pbtn" data-dir="down">▼</div><div></div>
    </div>
    <div id="ab">
      <button class="abtn" data-btn="b">B</button>
      <button class="abtn" data-btn="a">A</button>
    </div>
  </div>
  <div id="hint">キーボード: 矢印キー移動 / Z=A(はなす・しらべる) / X=B(メニュー・キャンセル)</div>
</div>

const TILE = 32, VW = 15, VH = 10;

const $msgwin = document.getElementById("msgwin");
const $msgtext = document.getElementById("msgtext");
const $msgcursor = document.getElementById("msgcursor");
const $statwin = document.getElementById("statwin");
const $menus = document.getElementById("menus");

/* ---------- 画像キャッシュ(img指定の差し替え対応) ---------- */
const imgCache = {};
function getImg(url){
  if(!imgCache[url]){ const im = new Image(); im.src = url; imgCache[url] = im; }
  return imgCache[url];
}
function drawSprite(spec, x, y, size){
  if(spec && spec.img){
    const im = getImg(spec.img);
    if(im.complete && im.naturalWidth) { ctx.drawImage(im, x, y, size, size); return; }
  }
  if(spec && spec.emoji){
    ctx.font = Math.floor(size*0.82) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(spec.emoji, x + size/2, y + size/2 + 2);
  }
}

/* ---------- ゲーム状態 ---------- */
let state;
function newGame(){
  const g = D.growth;
  state = {
    scene: "title",
    map: D.start.map, x: D.start.x, y: D.start.y, dir: "down",
    p: {
      lv:1, exp:0, gold: D.startGold,
      hp: g.maxhp(1), mp: g.maxmp(1),
      bonusAtk: 0,
      items: Object.assign({}, D.startItems)
    },
    flags: {}, opened: {},
    bossDown: false,
    moveCd: 0,
    msg: null, menus: [],
    battle: null,
    shake: 0
  };
  renderMenus(); hideMsg(); updateStat();
}
function pstat(){
  const g = D.growth, p = state.p;
  return {
    maxhp: g.maxhp(p.lv), maxmp: g.maxmp(p.lv),
    atk: g.atk(p.lv) + p.bonusAtk, def: g.def(p.lv)
  };
}
function knownSpells(){ return D.spells.filter(s => state.p.lv >= s.lv); }

/* ---------- メッセージ(タイプライタ式) ---------- */
function say(lines, cb){
  state.msg = { lines: Array.isArray(lines)?lines:[lines], i:0, ch:0, t:0, cb };
  $msgwin.style.display = "block";
  $msgcursor.style.display = "none";
  $msgtext.textContent = "";
}
function hideMsg(){ state.msg = null; $msgwin.style.display = "none"; }
function msgPress(){
  const m = state.msg; if(!m) return;
  const line = m.lines[m.i];
  if(m.ch < line.length){ m.ch = line.length; $msgtext.textContent = line; $msgcursor.style.display = "block"; return; }
  m.i++;
  if(m.i >= m.lines.length){
    const cb = m.cb; hideMsg(); if(cb) cb();
  } else {
    m.ch = 0; $msgtext.textContent = ""; $msgcursor.style.display = "none";
  }
}
function updateMsg(dt){
  const m = state.msg; if(!m) return;
  const line = m.lines[m.i];
  if(m.ch < line.length){
    m.t += dt;
    while(m.t > 0.022 && m.ch < line.length){ m.t -= 0.022; m.ch++; }
    $msgtext.textContent = line.slice(0, m.ch);
    if(m.ch >= line.length) $msgcursor.style.display = "block";
  }
}

/* ---------- メニュー ---------- */
function openMenu(m){ m.idx = 0; state.menus.push(m); renderMenus(); }
function closeMenu(){ state.menus.pop(); renderMenus(); }
function closeAllMenus(){ state.menus = []; renderMenus(); }
function topMenu(){ return state.menus[state.menus.length-1]; }
function renderMenus(){
  $menus.innerHTML = "";
  state.menus.forEach((m, mi) => {
    const div = document.createElement("div");
    div.className = "win menu";
    div.style.left = (16 + mi*70) + "px";
    div.style.top  = (16 + mi*26) + "px";
    let html = m.title ? `<div class="mtitle">${m.title}</div>` : "";
    m.items.forEach((it, i) => {
      html += `<div class="item ${i===m.idx?"sel":""}">${it.label}</div>`;
    });
    div.innerHTML = html;
    $menus.appendChild(div);
  });
}
function menuPress(btn){
  const m = topMenu(); if(!m) return;
  if(btn==="up"){ m.idx = (m.idx + m.items.length - 1) % m.items.length; renderMenus(); }
  else if(btn==="down"){ m.idx = (m.idx + 1) % m.items.length; renderMenus(); }
  else if(btn==="a"){ m.items[m.idx].action(); }
  else if(btn==="b"){ if(m.cancelable !== false){ closeMenu(); if(m.onCancel) m.onCancel(); } }
}

/* ---------- ステータス表示 ---------- */
function updateStat(){
  if(!state){ return; }
  if(state.scene==="field" || state.scene==="battle"){
    const s = pstat(), p = state.p;
    $statwin.style.display = "block";
    $statwin.textContent =
      `${D.hero.name}  LV${p.lv}\n` +
      `HP ${p.hp}/${s.maxhp}  MP ${p.mp}/${s.maxmp}\n` +
      `G ${p.gold}`;
  } else $statwin.style.display = "none";
}

/* ---------- マップ操作 ---------- */
function curMap(){ return D.maps[state.map]; }
function tileAt(map, x, y){
  const g = D.maps[map].grid;
  if(y<0||y>=g.length||x<0||x>=g[0].length) return null;
  return D.tiles[g[y][x]];
}
function tileChar(map,x,y){ return D.maps[map].grid[y][x]; }
function npcAt(x, y){ return curMap().npcs.find(n => n.x===x && n.y===y); }
function bossAt(x, y){
  if(state.bossDown) return false;
  return tileChar(state.map,x,y) === "B" ? true : false;
}
function isBlocked(x, y){
  const t = tileAt(state.map, x, y);
  const ch = tileChar(state.map, x, y);
  if(ch === "B") return !state.bossDown;      // ボスは体当たりで戦闘
  if(!t) return true;
  if(t.chest) return true;                     // 宝箱は「しらべる」で開く
  return !t.walkable;
}
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

function tryMove(dir){
  state.dir = dir;
  const [dx,dy] = DIRS[dir];
  const nx = state.x+dx, ny = state.y+dy;
  if(bossAt(nx,ny)){ triggerBoss(); return; }
  if(npcAt(nx,ny)) return;
  if(isBlocked(nx,ny)) return;
  state.x = nx; state.y = ny;
  state.moveCd = 0.17;
  // ワープ判定
  const w = curMap().warps.find(w => w.x===nx && w.y===ny);
  if(w){
    if(w.needFlag && !state.flags[w.needFlag]){
      say(w.denyMsg || "とびらは あかない…");
      state.x -= dx; state.y -= dy;
      return;
    }
    state.map = w.to; state.x = w.tx; state.y = w.ty;
    return;
  }
  // エンカウント判定
  const t = tileAt(state.map, nx, ny), m = curMap();
  if(t.encounter && m.monsters.length && Math.random() < m.encounterRate){
    const id = m.monsters[Math.floor(Math.random()*m.monsters.length)];
    startBattle(id, false);
  }
}

/* ---------- しらべる / はなす ---------- */
function fieldA(){
  const [dx,dy] = DIRS[state.dir];
  const tx = state.x+dx, ty = state.y+dy;
  const npc = npcAt(tx,ty);
  if(npc){ talkTo(npc); return; }
  const t = tileAt(state.map,tx,ty);
  if(t && t.chest){ openChest(tx,ty); return; }
}
function talkTo(npc){
  const entry = npc.talk.find(e =>
    (e.need===null && !(e.once && state.flags[e.once])) ||
    (e.need && state.flags[e.need]));
  if(!entry){ say(npc.name+"\n「……」"); return; }
  say(entry.lines, () => {
    if(entry.once) state.flags[entry.once] = true;
    if(entry.shop) openShop();
    if(entry.inn) offerInn(entry.inn);
  });
}
function openChest(x,y){
  const key = state.map + ":" + x + "," + y;
  if(state.opened[key]){ say("たからばこは からっぽだ。"); return; }
  const c = D.chests[key];
  if(!c){ say("たからばこは からっぽだ。"); state.opened[key]=true; return; }
  state.opened[key] = true;
  if(c.atk) state.p.bonusAtk += c.atk;
  if(c.gold) state.p.gold += c.gold;
  say(c.msg, updateStat);
}

/* ---------- 店・宿 ---------- */
function openShop(){
  const it = D.items.yakuso;
  openMenu({
    title:"みせ",
    items:[
      { label:`${it.name}をかう ${it.price}G`, action:()=>{
          if(state.p.gold < it.price){ closeAllMenus(); say("しょうにん\n「おかねが たりないよ!」"); return; }
          state.p.gold -= it.price;
          state.p.items.yakuso = (state.p.items.yakuso||0)+1;
          updateStat();
          closeAllMenus(); say(`${it.name}を かった!`, openShop);
        } },
      { label:"やめる", action:()=>{ closeAllMenus(); say("しょうにん\n「まいどあり!」"); } }
    ]
  });
}
function offerInn(price){
  openMenu({
    title:"やど",
    items:[
      { label:`とまる ${price}G`, action:()=>{
          closeAllMenus();
          if(state.p.gold < price){
            say("おかみ\n「おかねないのかい…\n　しかたないねえ タダでいいよ!」", doInn);
          } else { state.p.gold -= price; doInn(); }
        } },
      { label:"やめる", action:()=>{ closeAllMenus(); } }
    ]
  });
}
function doInn(){
  const s = pstat();
  state.p.hp = s.maxhp; state.p.mp = s.maxmp; updateStat();
  say("ぐっすり ねむって\nHPとMPが かいふくした!");
}

/* ---------- フィールドメニュー(B) ---------- */
function openFieldMenu(){
  openMenu({
    title:"めにゅー",
    items:[
      { label:"じゅもん", action: () => openSpellMenu(false) },
      { label:"どうぐ",   action: () => openItemMenu(false) },
      { label:"つよさ",   action: () => {
          const s = pstat(), p = state.p, g = D.growth;
          const next = p.lv >= g.maxLv ? "--" : (g.expNext(p.lv) - p.exp);
          closeAllMenus();
          say([`${D.hero.name}  LV${p.lv}`,
               `HP ${p.hp}/${s.maxhp}　MP ${p.mp}/${s.maxmp}`,
               `こうげき ${s.atk}　しゅび ${s.def}\nつぎのLVまで ${next}　G ${p.gold}`]);
        } },
      { label:"とじる", action: closeAllMenus }
    ]
  });
}
function openSpellMenu(inBattle){
  const sp = knownSpells();
  if(!sp.length){ closeAllMenus(); say("まだ じゅもんを おぼえていない!", inBattle?battleCommand:null); return; }
  openMenu({
    title:"じゅもん",
    items: sp.map(s => ({
      label:`${s.name}  MP${s.mp}`,
      action:()=> castSpell(s, inBattle)
    })).concat([{ label:"もどる", action: closeMenu }])
  });
}
function castSpell(s, inBattle){
  const p = state.p, st = pstat();
  if(p.mp < s.mp){ closeAllMenus(); say("MPが たりない!", inBattle?battleCommand:null); return; }
  if(s.type==="heal"){
    p.mp -= s.mp;
    const before = p.hp;
    p.hp = Math.min(st.maxhp, p.hp + s.power);
    updateStat(); closeAllMenus();
    say(`${D.hero.name}は ${s.name}をとなえた!\nHPが ${p.hp-before} かいふくした!`,
        inBattle ? enemyTurn : null);
  } else if(s.type==="attack"){
    if(!inBattle){ closeAllMenus(); say("いまは つかえない!"); return; }
    p.mp -= s.mp; updateStat(); closeAllMenus();
    const dmg = s.min + Math.floor(Math.random()*(s.max-s.min+1));
    dealToEnemy(dmg, `${D.hero.name}は ${s.name}をとなえた!`);
  }
}
function openItemMenu(inBattle){
  const n = state.p.items.yakuso || 0;
  if(!n){ closeAllMenus(); say("どうぐを もっていない!", inBattle?battleCommand:null); return; }
  openMenu({
    title:"どうぐ",
    items:[
      { label:`やくそう ×${n}`, action:()=>{
          const p = state.p, st = pstat();
          p.items.yakuso--;
          const before = p.hp;
          p.hp = Math.min(st.maxhp, p.hp + D.items.yakuso.heal);
          updateStat(); closeAllMenus();
          say(`やくそうを つかった!\nHPが ${p.hp-before} かいふくした!`,
              inBattle ? enemyTurn : null);
        } },
      { label:"もどる", action: closeMenu }
    ]
  });
}

/* ---------- 戦闘 ---------- */
function calcDmg(atk, def){
  const base = atk/2 - def/4;
  const v = base * (0.85 + Math.random()*0.3);
  return Math.max(1, Math.round(v));
}
function startBattle(id, isBoss){
  const m = D.monsters[id];
  state.battle = { id, m, hp: m.hp, isBoss };
  state.scene = "battle";
  updateStat();
  say(`${m.name}が あらわれた!`, battleCommand);
}
function triggerBoss(){
  say(D.boss.preLines, () => startBattle(D.boss.monster, true));
}
function battleCommand(){
  closeAllMenus();
  openMenu({
    title:"こまんど", cancelable:false,
    items:[
      { label:"たたかう", action: playerAttack },
      { label:"じゅもん", action: () => openSpellMenu(true) },
      { label:"どうぐ",   action: () => openItemMenu(true) },
      { label:"にげる",   action: tryEscape }
    ]
  });
}
function playerAttack(){
  closeAllMenus();
  const b = state.battle, s = pstat();
  const dmg = calcDmg(s.atk, b.m.def);
  dealToEnemy(dmg, `${D.hero.name}の こうげき!`);
}
function dealToEnemy(dmg, firstLine){
  const b = state.battle;
  b.hp -= dmg;
  state.shake = 0.25;
  if(b.hp <= 0){
    say([firstLine + `\n${b.m.name}に ${dmg}のダメージ!`,
         `${b.m.name}を たおした!`], winBattle);
  } else {
    say(firstLine + `\n${b.m.name}に ${dmg}のダメージ!`, enemyTurn);
  }
}
function enemyTurn(){
  const b = state.battle, s = pstat(), p = state.p;
  const dmg = calcDmg(b.m.atk, s.def);
  p.hp = Math.max(0, p.hp - dmg);
  updateStat();
  if(p.hp <= 0){
    say([`${b.m.name}の こうげき!\n${D.hero.name}は ${dmg}のダメージ!`,
         `${D.hero.name}は しんでしまった!`], gameOver);
  } else {
    say(`${b.m.name}の こうげき!\n${D.hero.name}は ${dmg}のダメージ!`, battleCommand);
  }
}
function tryEscape(){
  closeAllMenus();
  const b = state.battle;
  if(b.isBoss){ say("にげられない!!", enemyTurn); return; }
  if(Math.random() < 0.6){
    say(`${D.hero.name}は にげだした!`, endBattle);
  } else {
    say("しかし まわりこまれてしまった!", enemyTurn);
  }
}
function winBattle(){
  const b = state.battle, p = state.p, g = D.growth;
  if(b.isBoss){
    state.bossDown = true;
    state.battle = null;
    state.scene = "story";
    say(D.story.ending, () => { state.scene = "title"; newGame(); });
    return;
  }
  p.exp += b.m.exp; p.gold += b.m.gold;
  const lines = [`けいけんち ${b.m.exp}ポイント かくとく!\n${b.m.gold}ゴールドを てにいれた!`];
  while(p.lv < g.maxLv && p.exp >= g.expNext(p.lv)){
    p.exp -= g.expNext(p.lv);
    p.lv++;
    const s = pstat();
    p.hp = s.maxhp; p.mp = s.maxmp;   // レベルアップで全回復(親切設計)
    lines.push(`${D.hero.name}は レベル${p.lv}に あがった!\nHPとMPが ぜんかいふくした!`);
    D.spells.filter(sp => sp.lv === p.lv).forEach(sp =>
      lines.push(`${sp.name}の じゅもんを おぼえた!`));
  }
  updateStat();
  say(lines, endBattle);
}
function endBattle(){
  state.battle = null;
  state.scene = "field";
  updateStat();
}
function gameOver(){
  const p = state.p;
  p.gold = Math.floor(p.gold/2);
  p.hp = pstat().maxhp; p.mp = pstat().maxmp;
  state.battle = null;
  state.map = D.start.map; state.x = D.start.x; state.y = D.start.y;
  state.scene = "field";
  updateStat();
  say(D.story.gameover + "\n\n(しょじきんが はんぶんになった…)");
}

/* ---------- 入力 ---------- */
const held = {};
function press(btn){
  if(!btn) return;
  if(state.scene === "title"){
    if(btn==="a"){ state.scene="story"; say(D.story.opening, () => { state.scene="field"; updateStat(); }); }
    return;
  }
  if(state.msg){ if(btn==="a"||btn==="b") msgPress(); return; }
  if(state.menus.length){ menuPress(btn); return; }
  if(state.scene === "field"){
    if(btn==="a") fieldA();
    else if(btn==="b") openFieldMenu();
  }
}
const KEYMAP = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
  z:"a", Z:"a", Enter:"a", x:"b", X:"b", Escape:"b", " ":"a" };
// iPhone Safari: ピンチ・ダブルタップで拡大されるのを止める
["gesturestart","gesturechange","gestureend"].forEach(t => addEventListener(t, e => e.preventDefault()));
let lastTouchEnd = 0;
addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });
addEventListener("keydown", e => {
  const b = KEYMAP[e.key]; if(!b) return;
  e.preventDefault();
  if(!held[b]) press(b);
  held[b] = true;
});
addEventListener("keyup", e => { const b = KEYMAP[e.key]; if(b) held[b] = false; });

document.querySelectorAll(".pbtn").forEach(el => {
  const d = el.dataset.dir;
  el.addEventListener("pointerdown", e => { e.preventDefault(); held[d]=true; el.classList.add("held"); press(d); });
  const up = e => { held[d]=false; el.classList.remove("held"); };
  el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
});
document.querySelectorAll(".abtn").forEach(el => {
  el.addEventListener("pointerdown", e => { e.preventDefault(); press(el.dataset.btn); });
});

/* ---------- 描画 ---------- */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function drawField(){
  const m = curMap(), g = m.grid;
  const mw = g[0].length, mh = g.length;
  const camx = clamp(state.x - Math.floor(VW/2), 0, Math.max(0, mw - VW));
  const camy = clamp(state.y - Math.floor(VH/2), 0, Math.max(0, mh - VH));
  for(let vy=0; vy<VH; vy++){
    for(let vx=0; vx<VW; vx++){
      const x = camx+vx, y = camy+vy;
      if(x>=mw || y>=mh) continue;
      const ch = g[y][x];
      const t = D.tiles[ch] || { color:"#000" };
      ctx.fillStyle = (ch==="B") ? D.tiles["-"].color : t.color;
      ctx.fillRect(vx*TILE, vy*TILE, TILE, TILE);
      if(ch==="C" && state.opened[state.map+":"+x+","+y]){
        // 開封済み宝箱
        drawSprite({emoji:"⬜"}, vx*TILE, vy*TILE, TILE);
      } else if(ch==="B"){
        if(!state.bossDown) drawSprite(D.monsters[D.boss.monster], vx*TILE, vy*TILE, TILE);
      } else {
        drawSprite(t, vx*TILE, vy*TILE, TILE);
      }
    }
  }
  // NPC
  m.npcs.forEach(n => {
    const vx = n.x-camx, vy = n.y-camy;
    if(vx>=0&&vx<VW&&vy>=0&&vy<VH) drawSprite(n, vx*TILE, vy*TILE, TILE);
  });
  // 主人公
  drawSprite(D.hero, (state.x-camx)*TILE, (state.y-camy)*TILE, TILE);
  // マップ名
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(cv.width-150, 8, 142, 24);
  ctx.fillStyle = "#fff"; ctx.font = "13px 'DotGothic16', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(m.name, cv.width-79, 20);
}
function drawBattle(){
  const grad = ctx.createLinearGradient(0,0,0,cv.height);
  grad.addColorStop(0,"#0d0d1f"); grad.addColorStop(1,"#1c1030");
  ctx.fillStyle = grad; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.beginPath(); ctx.ellipse(cv.width/2, 200, 120, 30, 0, 0, Math.PI*2); ctx.fill();
  const b = state.battle;
  if(b){
    const ox = state.shake > 0 ? (Math.random()*8-4) : 0;
    drawSprite(b.m, cv.width/2-56+ox, 78, 112);
    ctx.fillStyle = "#fff"; ctx.font = "15px 'DotGothic16', monospace";
    ctx.textAlign = "center";
    ctx.fillText(b.m.name + "  HP " + Math.max(0,b.hp), cv.width/2, 56);
  }
}
function drawTitle(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "40px 'DotGothic16', monospace";
  ctx.fillStyle = "#ffd54f";
  ctx.fillText(D.title, cv.width/2, 110);
  ctx.font = "15px 'DotGothic16', monospace";
  ctx.fillStyle = "#aaa";
  ctx.fillText(D.subtitle, cv.width/2, 150);
  if(Math.floor(performance.now()/500)%2===0){
    ctx.fillStyle = "#fff";
    ctx.fillText("PUSH  A  BUTTON", cv.width/2, 230);
  }
  ctx.font = "26px serif";
  ctx.fillText(D.hero.emoji, cv.width/2, 188);
}
function drawStory(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,cv.width,cv.height);
}

/* ---------- メインループ ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  state.moveCd = Math.max(0, state.moveCd - dt);
  state.shake  = Math.max(0, state.shake - dt);
  updateMsg(dt);
  if(state.scene==="field" && !state.msg && !state.menus.length && state.moveCd<=0){
    for(const d of ["up","down","left","right"]){
      if(held[d]){ tryMove(d); break; }
    }
  }
  ctx.clearRect(0,0,cv.width,cv.height);
  if(state.scene==="title") drawTitle();
  else if(state.scene==="story") drawStory();
  else if(state.scene==="battle") drawBattle();
  else drawField();
  requestAnimationFrame(loop);
}
newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
