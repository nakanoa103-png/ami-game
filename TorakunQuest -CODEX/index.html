<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171322">
  <title>虎くんクエスト</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main class="game-shell" aria-label="虎くんクエスト">
    <header class="brand">
      <p class="brand-kicker">TORAKUN QUEST</p>
      <h1 id="game-title">虎くんクエスト</h1>
    </header>

    <section class="game-frame">
      <div class="screen-wrap">
        <canvas id="game-canvas" width="480" height="320" aria-label="ゲーム画面"></canvas>
        <div id="screen-flash" aria-hidden="true"></div>

        <section id="title-screen" class="overlay title-screen">
          <div class="title-emblem">✦</div>
          <p id="title-subtitle" class="title-subtitle"></p>
          <div class="title-actions">
            <button id="new-game-button" type="button">はじめから</button>
            <button id="continue-button" type="button">つづきから</button>
          </div>
          <p class="blink">Aボタン / Enterで決定</p>
        </section>

        <section id="message-window" class="message-window" hidden aria-live="polite">
          <p id="speaker-name" class="speaker-name"></p>
          <p id="message-text" class="message-text"></p>
          <span class="message-cursor" aria-hidden="true">▼</span>
        </section>

        <section id="command-window" class="command-window" hidden aria-label="コマンド">
          <h2 id="command-title"></h2>
          <div id="command-list" class="command-list"></div>
        </section>

        <section id="status-window" class="status-window" hidden>
          <div><strong id="status-name">虎くん</strong><span>Lv <b id="status-level">1</b></span></div>
          <div><span>HP <b id="status-hp">0</b>/<b id="status-max-hp">0</b></span><span>MP <b id="status-mp">0</b>/<b id="status-max-mp">0</b></span></div>
          <div><span><b id="status-gold">0</b> G</span><span id="status-place"></span></div>
        </section>
      </div>

      <div class="controls" aria-label="ゲーム操作">
        <div class="dpad" aria-label="方向キー">
          <button class="control up" data-key="up" type="button" aria-label="上">▲</button>
          <button class="control left" data-key="left" type="button" aria-label="左">◀</button>
          <button class="control right" data-key="right" type="button" aria-label="右">▶</button>
          <button class="control down" data-key="down" type="button" aria-label="下">▼</button>
        </div>
        <div class="action-buttons">
          <button class="control button-b" data-key="b" type="button"><small>メニュー</small>B</button>
          <button class="control button-a" data-key="a" type="button"><small>決定</small>A</button>
        </div>
      </div>
    </section>

    <footer>
      <span>移動：矢印キー / WASD</span>
      <span>決定：Z / Enter　メニュー：X / Esc</span>
      <button id="reset-save-button" class="text-button" type="button">セーブデータを消す</button>
    </footer>
  </main>

  <script src="data/game-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
